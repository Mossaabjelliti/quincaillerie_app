name: quincaillerie_app
description: App de gestion de stock offline-first pour quincailleries tunisiennes
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (simple, good for mixed-skill teams)
  provider: ^6.1.2

  # Local database - offline-first core
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # Backend / sync
  supabase_flutter: ^2.5.6
  connectivity_plus: ^6.0.3

  # Barcode / QR scanning (camera-based, no hardware needed for MVP)
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0 # to generate/print QR codes for products

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
